<style>
:root{--navy:#151e36;--gold:#ae802c;--cream:#f5f2ec;--ink:#19223a;--muted:#657084;--line:#e2ded7;--f-display:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;--f-text:"Newsreader",Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.55 var(--f-text)}
h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:var(--f-display);letter-spacing:-.025em}a{color:inherit}
.wrap{max-width:1100px;margin:auto;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #ded8ce}
.brand{font-family:var(--f-display);font-weight:600;letter-spacing:.14em;color:var(--navy);font-size:17px}
.homelink{font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:.04em;color:#7a6234;text-decoration:none;border-bottom:1px solid #d4b976}
.homelink:hover{color:var(--navy)}
.hero{padding:62px 0 30px;display:grid;grid-template-columns:1.4fr .8fr;gap:40px;align-items:center}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;font-weight:600;color:#966e24;text-transform:uppercase}
.hero h1{font-size:clamp(36px,5vw,58px);line-height:1.07;margin:14px 0 22px;font-weight:600;max-width:760px}
.name{color:#a57a2b}
.lead{font-size:20px;color:#4c576c;max-width:640px}
.heard{background:#fff;border:1px solid #d9c79c;border-radius:6px;padding:26px}
.heard .tag{font-family:var(--f-display);font-size:11px;color:#886422;letter-spacing:.14em;font-weight:600;margin-bottom:12px}
.heard ul{margin:0;padding-left:18px;color:#3b465c;font-size:16px;display:grid;gap:10px}
.section{padding:36px 0}
.sectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
.sectionHead h2{font-size:30px;margin:0;font-weight:600}.sectionHead p{font-size:15px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:5px;padding:22px}
.tile .num{font-family:var(--f-display);font-size:12px;color:#b18435;font-weight:600;letter-spacing:.12em;margin-bottom:12px}
.tile h3{font-size:19px;line-height:1.25;margin-bottom:9px;font-weight:600}.tile p{font-size:16px;color:#4f5a6c;margin:0}
.guarantees{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.guarantee{background:#fff;border:1px solid #d1b476;border-radius:5px;padding:24px;position:relative}
.guarantee:before{content:'\2713';position:absolute;right:18px;top:14px;color:#b88b34;font-size:26px;font-weight:700}
.guarantee h3{font-size:23px;margin:8px 0 10px;font-weight:600}.guarantee p{font-size:16px;color:#4f5a6c;margin:0;max-width:94%}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:var(--navy);color:#fff;padding:32px;border-radius:6px}
.glance h2{font-size:27px;font-weight:600}.glance p{color:#c4ccdb;font-size:16px}
.glance ul{margin:0;padding-left:19px;color:#dde4f1;font-size:16px}.glance li{margin:9px 0}
.offer{background:#fff;border:1.5px solid #d4b976;border-radius:8px;padding:clamp(24px,4vw,44px);text-align:center;max-width:820px;margin:0 auto}
.offer h2{font-size:clamp(26px,3.6vw,36px);margin:10px 0 12px;font-weight:600}
.lead2{font-size:18px;color:#4c576c;max-width:560px;margin:0 auto 24px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin-bottom:26px}
.col{border:1px solid var(--line);border-radius:6px;padding:20px;background:#faf8f3}
.col.hot{border:1.5px solid var(--gold);background:#fffdf7}
.ctitle{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.col.hot .ctitle{color:#8a6420}
.cprice{font-family:var(--f-display);font-size:34px;font-weight:600;margin:6px 0 10px}.cprice s{font-size:18px;color:#8a909b;font-weight:400;margin-left:6px}
.col ul{margin:0;padding-left:18px;font-size:15px;color:#4f5a6c;display:grid;gap:5px}
.col.dim ul{color:#7d8492}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--navy);color:#fff;border-radius:4px;padding:15px 24px;font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.05em;border:1px solid var(--navy);cursor:pointer}
.btn:hover{background:#293857}.btn.ghost{background:transparent;color:var(--navy)}.btn.ghost:hover{background:#ece7dc}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#141b33}.btn.small{padding:11px 18px;font-size:13px}
.btn:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b88a30;outline-offset:3px}
.micro{font-family:var(--f-display);font-size:13px;color:#7c8491;margin-top:16px}
.faq{margin:12px 0;border:1px solid var(--line);border-radius:5px;background:#fff}
.faq summary{cursor:pointer;padding:16px 20px;font-family:var(--f-display);font-weight:500;font-size:16px}
.faq div{padding:0 20px 16px;color:#5d6779;font-size:16px}
.foot{border-top:1px solid #e1dbd0;padding:28px 0 48px;display:flex;justify-content:space-between;align-items:flex-start;gap:30px;font-size:13px;color:#747d8a;font-family:var(--f-display)}
.foot strong{color:#25304a}.foot p{max-width:620px;margin:0}
.lock{position:fixed;inset:0;z-index:20;background:#ede9e1;display:flex;align-items:center;justify-content:center;padding:20px}
.lockpanel{max-width:440px;width:100%;background:#fff;border:1px solid #dac9a9;box-shadow:0 24px 75px #10172b1a;border-radius:8px;padding:38px}
.lockpanel .brand{margin-bottom:30px}.lockpanel h2{font-size:30px;line-height:1.15;margin:12px 0 12px;font-weight:600}
.lockpanel p{color:#5f6779;font-size:17px}
.lockpanel label{display:block;font-family:var(--f-display);font-size:13px;font-weight:600;margin:22px 0 7px}
.lockpanel input{width:100%;padding:14px;border:1px solid #c9c9ca;border-radius:4px;font-size:16px;margin-bottom:12px;font-family:var(--f-display)}
.lockpanel .btn{width:100%}
.err{color:#a53631!important;min-height:20px;margin:10px 0 0;font-size:14px!important;font-family:var(--f-display)}
.fine{color:#8b8a86;font-size:12px;margin-top:12px;font-family:var(--f-display)}
.hidden{display:none!important}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:38px 0 20px}.grid,.guarantees,.glance,.compare{grid-template-columns:1fr}.sectionHead{display:block}.sectionHead p{margin-top:6px}.foot{display:block}.foot .btn{margin-top:18px}.glance{padding:24px}.top{padding:18px 0}.homelink{font-size:12px}}
</style></head><body>
